name: Update profile statistics

on:
  schedule:
    # 08:23 Asia/Macau; GitHub may delay scheduled runs.
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_profile.py'
      - '.github/workflows/profile-stats.yml'
      - '.github/profile-refresh-request.json'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate cards from public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/update_profile.py
      - name: Save refreshed statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats-dark.svg assets/github-stats-light.svg assets/github-stats.json
          if git diff --cached --quiet; then
            echo 'Statistics are already current.'
            exit 0
          fi
          git commit -m 'chore: refresh public profile statistics'
          git pull --rebase origin main
          git push origin HEAD:main
