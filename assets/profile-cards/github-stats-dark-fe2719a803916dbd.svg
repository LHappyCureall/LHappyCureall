<title id="title">LHappyCureall — GitHub statistics</title>
<desc id="description">Repository and community metrics use public data. Commit totals include public and private owned repositories accessible to the statistics token, default branches only, deduplicated by SHA, filtered to the owner&#x27;s GitHub-linked author identity and committer dates. Only aggregate private counts are published. Repository totals include owned forks; source repos exclude forks. Stars and forks are received totals across owned public repos. Issues and PRs are all-time authored public items (open and closed). Languages count the primary language of each non-fork public repo, not code bytes or proficiency. Updated 2026-09-09 04:53 UTC.</desc>
